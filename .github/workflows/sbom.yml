name: SBOM

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate_sbom:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.3

      - name: Generate SBOM
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          mkdir -p dist/
          syft scan dir:. \
            -o syft-json=dist/"${NAME}"_syft.json \
            -o cyclonedx-json=dist/"${NAME}"_cyclonedx.json \
            --source-name="${NAME}"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/*.json
