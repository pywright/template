name: SBOM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_sbom:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install syft
        run: curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          mkdir -p dist/
          syft scan dir:. \
            -o syft-json=dist/"${NAME}"_syft.json \
            -o cyclonedx-json@1.6=dist/"${NAME}"_cyclonedx.json \
            --source-name="${NAME}"

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/*.json

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.json --generate-notes
