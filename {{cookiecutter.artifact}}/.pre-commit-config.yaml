repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude_types: [makefile]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: check-symlinks

  - repo: local
    hooks:
      - id: mbake
        name: mbake
        entry: uv run --frozen mbake format
        language: system
        types: [makefile]

      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]

      - id: pyrefly
        name: pyrefly
        entry: uv run --frozen pyrefly check
        language: system
        types: [python]
        pass_filenames: false

      - id: shellcheck
        name: shellcheck
        entry: uv run --frozen shellcheck
        language: system
        types: [shell]

      - id: shfmt
        name: shfmt
        entry: uv run --frozen shfmt -w
        language: system
        types: [shell]
