[project]
name = "{{ cookiecutter.artifact }}"
version = "{{ cookiecutter.__version }}"
description = "{{ cookiecutter.__title }}"
license = { file = "LICENSE" }
readme = "README.md"

authors = [
    { name = "{{ cookiecutter.__author }}", email = "{{ cookiecutter.__email }}" },
]

classifiers = [
    "Environment :: Console",
    "Programming Language :: Python",
]

requires-python = ">=3.12"

dependencies = [
]

[dependency-groups]
dev = [
    "mbake >=1.4.6",
    "pre-commit >=4.7.0",
    "pyrefly >=1.3.2",
    "pytest >=9.1.1",
    "pytest-cov >=7.1.0",
    "ruff >=0.17.0",
    "shellcheck-py >=0.11.0.1",
    "shfmt-py >=4.2.0",
]

[project.scripts]
{{ cookiecutter.artifact }} = "{{ cookiecutter.__module }}.cli:cli"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # security
    "D",    # docstrings
    "ARG",  # unused arguments
    "SIM",  # simplify
    "PL",   # pylint
]
ignore = [
    "D1",    # missing docstrings
    "S603",  # subprocess call
    "S607",  # partial executable path
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PL", "S"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.uv]
package = false
default-groups = "all"
