name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
{%- if cookiecutter.__packaging == 'python' %}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7.6.0
        with:
          enable-cache: true

      - name: Build distributions
        run: make build

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
{%- elif cookiecutter.__packaging == 'debian' %}
    runs-on: {{ 'ubuntu-24.04-arm' if cookiecutter.__arch == 'arm64' else 'ubuntu-24.04' }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build Debian package
        run: make build

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: deb-{{ cookiecutter.__codename }}-{{ cookiecutter.__arch }}
          path: |
            dist/*.deb
            dist/*.deb.sha256
          if-no-files-found: error
{%- endif %}
