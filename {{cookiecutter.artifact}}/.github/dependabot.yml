version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
{%- if cookiecutter.__packaging == 'debian' %}

  - package-ecosystem: docker
    directory: /packaging
    schedule:
      interval: weekly
{%- endif %}
